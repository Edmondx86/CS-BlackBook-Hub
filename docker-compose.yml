services:
  backend:
    build: ./backend
    container_name: cs-topdown-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cs-topdown-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
