services:
  backend:
    build: ./backend
    container_name: cs-blackbook-backend
    # 不对外发布端口：只有同一网络的 nginx 能访问它，公网无法直连 API 或 /docs。
    # 同时这也让后端的 X-Forwarded-For 可信（见 app/services/guard.py 的限流实现）。
    expose:
      - "8000"
    environment:
      # 公网部署：关掉 /docs 与 /openapi.json，少一处可探测面
      - ENABLE_DOCS=false
      # 判题熔断开关：被刷时改成 false 并重启即可止血（不必改代码）
      - JUDGE_ENABLED=true
      # 判题引擎：subprocess（默认）。判题会在本容器内用 bubblewrap 起学生代码
      - JUDGE_ENGINE=subprocess
    # ⚠️ 必须有这一行：Docker 默认的 seccomp 会挡掉 unshare(CLONE_NEWUSER)，
    # 容器里的 bubblewrap 会直接失败（实测：bwrap: No permissions to create a new namespace），
    # 于是判题静默退化成「无命名空间隔离地裸跑学生代码」—— 而这正是判题唯一隔离层。
    # 实测 seccomp=unconfined 即可让完整参数集正常工作（--cap-add SYS_ADMIN 反而会在
    # pivot_root 处失败，--privileged 能过但权限过大，都不如这个）。
    security_opt:
      - seccomp=unconfined
    networks:
      - judge-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cs-blackbook-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    # 前端同时挂两个网络：default 保证 80 端口对外可达，judge-net 用于反代到 backend
    networks:
      - default
      - judge-net
    restart: unless-stopped

networks:
  # 判题内网：标记 internal 后，只挂在这个网络上的容器没有对外路由。
  # 后端只挂这里 —— 学生提交的代码即使在后端容器里被执行，也无法访问外网
  # （防止被当作跳板去压测/攻击第三方，或把服务器 IP 刷进黑名单）。
  judge-net:
    driver: bridge
    internal: true
