# CS-BlackBook-Hub 宿主机 nginx 站点配置（不用 Docker）
#
# 安装位置：/etc/nginx/conf.d/cs-blackbook.conf
# 用法见 deploy/DEPLOY.md
#
# 部署形态：
#   ┌── 宿主机 nginx ──┬── /             → /var/www/cs-blackbook  （Vite 构建产物）
#   │                  ├── /api/         → 127.0.0.1:8000        （uvicorn）
#   │                  └── /static/      → 127.0.0.1:8000        （PDF 等静态资源）
#   └── systemd: csbb-backend ── uvicorn --host 127.0.0.1 --port 8000
#
# 后端只监听回环地址，公网无法绕过 nginx 直连 API —— 这也是后端
# X-Forwarded-For 限流（app/services/guard.py）可信的前提。
#
# 本服务器的 nginx 专供本项目使用，因此建议顺手把发行版自带的默认站点停掉，
# 免得「用 IP 直连」时落到默认站点上：
#     rm -f /etc/nginx/sites-enabled/default   # Ubuntu/Debian
#     nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name csblackbookhub.com www.csblackbookhub.com;

    root /var/www/cs-blackbook;
    index index.html;

    # 留一个 ACME 的兜底入口（certbot 会自行插入它自己的 location，保留这行不影响）
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # 判题提交是 JSON，源码上限 200k 字符（后端 MAX_SUBMISSION_CHARS），1m 留足余量
    client_max_body_size 1m;

    # 基础安全响应头
    # 注意：X-Frame-Options 不能设成 DENY —— /about 页用同源 iframe 内嵌了终端页
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带内容哈希的构建产物可以长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 注意：location 里一旦出现 add_header，server 级的 add_header 就不再继承，
        # 所以这里要把安全头重复一遍，否则静态资源会丢掉 nosniff。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 终端页（/terminal/）等 public 目录下的静态文件由上面的 / 规则直接命中，无需额外配置

    # Vue SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 判题实测最慢约 7 秒（sock-pinger），60 秒留足余量
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反代后端静态资源（作业要求 PDF）
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
