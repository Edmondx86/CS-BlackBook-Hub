server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 判题提交是 JSON，源码上限 200k 字符（见后端 MAX_SUBMISSION_CHARS），1m 留足余量。
    # 同时挡住超大请求体，避免无谓地占用后端连接。
    client_max_body_size 1m;

    # 基础安全响应头（注意：不要设成 DENY，/about 页用同源 iframe 内嵌了终端页）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vue SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API（docker-compose 中后端服务名为 backend）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 判题实测最慢约 7 秒（sock-pinger），60 秒留足余量
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 反代后端静态资源（PDF 文档 / 初始代码）
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
